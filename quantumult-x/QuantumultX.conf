# 自动选择用于通用代理；地区组手动固定节点，保持国外 AI、音乐和流媒体出口稳定。
# 按名称中的国家、旗帜及常见城市筛选；十个常用地区以外的节点进入“其他地区”。
# 名称归类不检测真实出口 IP，也不会自动创建国家组。
# check-interval 单位秒，tolerance 单位毫秒。
